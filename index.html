<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Control Diario de Conductor</title>
  <meta name="theme-color" content="#0b1120" />
  <link rel="icon" href="/pwa-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/pwa-icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">

  <script>
    // Aplica el tema guardado antes de pintar, para evitar un destello de color incorrecto.
    try {
      var savedTheme = localStorage.getItem('driverAppTheme');
      document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Colores semánticos: cada uno cambia de valor entre modo oscuro y claro (ver src/styles.css).
    var token = function (name) { return 'rgb(var(--c-' + name + ') / <alpha-value>)'; };
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            app: token('app'),
            card: token('card'),
            field: token('field'),
            raised: token('raised'),
            line: token('line'),
            main: token('main'),
            muted: token('muted'),
            faint: token('faint'),
            brand: token('brand'),
            'on-brand': token('on-brand'),
            good: token('good'),
            bad: token('bad'),
            warn: token('warn'),
            info: token('info'),
            violet: token('violet'),
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="bg-app text-main font-sans antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
